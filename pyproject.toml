[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scenario-simulator"
version = "0.1.0"
authors = [
    { name="Jules", email="jules@example.com" },
]
description = "A natural language based state-space explorer and constraint solver."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "networkx",
    "z3-solver",
    "numpy",
    "matplotlib",
    "graphviz",
    "pydantic",
    "google-generativeai",
    "PySide6",
]

[tool.setuptools.packages.find]
where = ["src"]
